name: yava_delivery_driver
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  lottie: ^2.7.0
  pdf: ^3.10.8
  http: ^1.5.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.14.0
  printing: ^5.12.0
  syncfusion_flutter_charts: ^31.2.3
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.3.0
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  firebase_database: ^11.3.10
  firebase_storage: ^12.4.10
  socket_io_client: ^2.0.3
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/yava_icon_app.png"
  adaptive_icon_background: "#ffffff"   # color de fondo (puedes poner transparente o el color de tu marca)
  adaptive_icon_foreground: "assets/images/yava_icon_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash_images/
    - assets/images/welcome/
    - assets/images/onboarding/
    - assets/images/login/
    - assets/images/register/
