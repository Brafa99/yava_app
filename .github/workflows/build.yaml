name: Build & Release YAVA APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK YAVÁ
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Flutter (Canal Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Instalar dependencias del proyecto
        run: flutter pub get

      - name: 5. Asegurar Label "YAVÁ" y Gradle 8.14
        run: |
          sed -i 's/android:label="[^"]*"/android:label="YAVÁ"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/gradle-[0-9.]*-bin\.zip/gradle-8.14-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-[0-9.]*-all\.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: 6. Generar Ícono Oficial de la App (flutter_launcher_icons)
        run: |
          dart run flutter_launcher_icons || true

      - name: 7. Compilar APK en modo Release (Con bypass de validación Gradle)
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: 8. Renombrar APK en la raíz para descarga fácil
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk YAVA.apk

      - name: 9. Subir APK como Artifact en la pestaña Actions
        uses: actions/upload-artifact@v4
        with:
          name: YAVA-APK
          path: YAVA.apk

      - name: 10. Publicar APK directo en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "YAVÁ App v1.0.${{ github.run_number }}"
          body: "APK oficial compilado automáticamente con ícono y label YAVÁ."
          files: YAVA.apk
