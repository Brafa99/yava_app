# Soporte obligatorio de AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Desactivar compilación incremental para evitar el conflicto de discos C: y D:
kotlin.incremental=false

# Memoria para que el compilador trabaje con holgura
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m

# Supresión de errores de compatibilidad estricta
kotlin.suppress.incompatible.class.version.error=true